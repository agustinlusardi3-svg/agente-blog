name: Generador Automático de Contenido

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8 AM
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'Bot Generador'
          git config --global user.email 'bot@users.noreply.github.com'
          git add posts/
          git commit -m "Nuevo artículo generado automáticamente por IA"
          git push