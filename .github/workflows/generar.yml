name: Generador Automático de Contenido

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8 AM
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install google-genai

      - name: Ejecutar agente generador
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generar la página web (HTML)
        run: python build.py

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generar nuevo artículo y actualizar web" || exit 0
          git push
